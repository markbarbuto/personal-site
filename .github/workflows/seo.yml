name: SEO checks

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check SEO essentials
        run: npm run check:seo

      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lhci-report
